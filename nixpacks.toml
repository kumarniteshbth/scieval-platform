[phases.setup]
nixPkgs = ["nodejs_20", "php83", "php83Extensions.bcmath", "php83Extensions.curl", "php83Extensions.fileinfo", "php83Extensions.mbstring", "php83Extensions.openssl", "php83Extensions.pdo_mysql", "php83Extensions.xml", "php83Extensions.zip"]

[phases.install]
cmds = [
  "curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && ls -la /usr/local/bin/composer",
  "/usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
  "npm run build"
]

# NOTE: No build-time caching - DB env vars are NOT available at build time

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
